<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Gabarito; font-weight: 800; src: url(../../node_modules/@expo-google-fonts/gabarito/800ExtraBold/Gabarito_800ExtraBold.ttf); }
  @font-face { font-family: Onest; font-weight: 500; src: url(../../node_modules/@expo-google-fonts/onest/500Medium/Onest_500Medium.ttf); }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow: hidden; background: #E6EAFF; }
  body {
    width: var(--w); height: var(--h);
    background:
      radial-gradient(60% 30% at 0% 40%, rgba(167, 186, 255, 0.45), transparent 70%),
      radial-gradient(55% 25% at 100% 100%, rgba(170, 150, 255, 0.45), transparent 70%),
      linear-gradient(175deg, #F1F2FF 0%, #E6EAFF 50%, #DCDFFC 100%);
    display: flex; flex-direction: column; align-items: center;
    padding-top: calc(var(--u) * 13);
    font-family: Gabarito, sans-serif;
  }
  h1 {
    position: relative; margin: 0; text-align: center;
    font-size: calc(var(--u) * 9.6); line-height: 1.04; letter-spacing: -0.02em;
    color: #12142B;
  }
  .hl { position: relative; white-space: nowrap; }
  .hl b {
    font-weight: 800;
    background: linear-gradient(90deg, #2F5BEA, #6B3BEA);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .swoosh { position: absolute; left: 3%; width: 98%; bottom: -0.2em; height: 0.24em; overflow: visible; }
  .sparks { position: absolute; right: -0.55em; top: -0.42em; width: 0.62em; height: 0.62em; overflow: visible; }
  p {
    margin: calc(var(--u) * 3.2) 0 0; text-align: center; max-width: 82%;
    font: 500 calc(var(--u) * 4.1)/1.3 Onest, sans-serif; color: #5A6083;
  }
  .phone {
    margin-top: calc(var(--u) * 7);
    padding: calc(var(--u) * 1.5);
    background: #fff; border-radius: calc(var(--u) * 7.5);
    box-shadow: 0 calc(var(--u) * 3) calc(var(--u) * 9) rgba(60, 70, 160, 0.22);
  }
  .phone img { display: block; width: auto; border-radius: calc(var(--u) * 6); }
</style>
</head>
<body>
  <h1 id="title"></h1>
  <p id="sub"></p>
  <div class="phone"><img id="shot" alt=""></div>
<script>
  const COPY = {
    1: ['Learn Spanish', 'with', 'Crosswords', 'Fun and effective practice for every level'],
    2: ['Solve Crosswords', 'to', 'Learn Spanish', 'Practice real words and grow your vocabulary'],
    3: ['Use Clues', 'and', 'Learn Naturally', 'Clear hints in Spanish with English translations'],
    4: ['Build Your', '', 'Vocabulary', 'Practice Spanish words and see your progress'],
    5: ['Choose a Level', 'and a', 'Theme', 'Crosswords for your pace and interests'],
  };
  const SIZES = { ios: [1320, 2868], android: [1080, 1920] };

  const q = new URLSearchParams(location.search);
  const store = q.get('store');
  const n = q.get('n');
  const [w, h] = SIZES[store];
  const [line1, lead, highlight, sub] = COPY[n];
  const u = w / 100;
  const root = document.documentElement.style;
  root.setProperty('--w', w + 'px');
  root.setProperty('--h', h + 'px');
  root.setProperty('--u', u + 'px');

  const swoosh = '<svg class="swoosh" viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M2 7 Q 50 1 98 4" stroke="#FFC21A" stroke-width="3.2" fill="none" stroke-linecap="round" vector-effect="non-scaling-stroke" style="stroke-width:calc(var(--u)*1.1)"/></svg>';
  const sparks = '<svg class="sparks" viewBox="0 0 10 10"><g stroke="#FFC21A" stroke-width="1.3" stroke-linecap="round"><path d="M2.2 4.6 L3.4 0.8"/><path d="M4.6 6 L7.6 3"/><path d="M5.6 8.6 L9.2 7.6"/></g></svg>';
  document.getElementById('title').innerHTML =
    `${line1}${sparks}<br>${lead ? lead + ' ' : ''}<span class="hl"><b>${highlight}</b>${swoosh}</span>`;
  document.getElementById('sub').textContent = sub;
  const shot = document.getElementById('shot');
  // The screen fills whatever height the headline leaves, minus the frame and a bottom margin.
  document.fonts.ready.then(() => {
    const phone = document.querySelector('.phone');
    const pad = parseFloat(getComputedStyle(phone).paddingTop);
    shot.style.height = Math.floor(h - phone.offsetTop - 2 * pad - u * 6) + 'px';
    shot.src = `raw/${store}-${n}.png`;
  });
</script>
</body>
</html>
